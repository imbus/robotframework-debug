name: Test the compatibility matrix

on:
  # Allows manual triggering from the GitHub Actions tab or from a PR
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number (Optional)'
        required: false
        default: ''

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python pin 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Execute invoke matrix
        run: |
          source .venv/bin/activate && invoke matrix
